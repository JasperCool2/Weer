<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PW='cmVnZW5ib29n',OK='weerInJou.ok';
function unlock(){document.body.classList.remove('locked');$('lock').remove()}
(function(){let ok=false;try{ok=localStorage.getItem(OK)===PW}catch(e){}
if(ok){unlock();return}
$('lp').focus();

const fsRoot=document.documentElement,fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);

const Q1=["Waar word je echt blij van, en hoe vaak doe je dat?","Wat zou je graag vaker doen, en wat houdt je tegen?","Wat doe je als je nergens aan hoeft, en wat zegt dat over jou?","Welk compliment kreeg je onlangs, en klopt het?"];

const P={
adem:{i:"ti-wind",l:"Adem",b:"breath",t:"Adem mee met het vuurtje: in als het groeit, uit als het zakt.",d:"Rustig ademen met een lange uitademing remt je stressreactie af. Het vuurtje geeft het tempo aan."},
aarden:{i:"ti-hand-stop",l:"Aarden",b:"text",t:"Noem rustig: 5 dingen die je ziet, 4 die je voelt, 3 die je hoort, 2 die je ruikt en 1 die je proeft.",d:"Je zintuigen langsgaan haalt je uit je hoofd en terug in het hier en nu."},

zorgen:{i:"ti-umbrella",l:"Zorgen",b:"write",t:"Welke gedachten blijven rondwaaien? Leg ze hier neer, onder de bladeren. Dit wordt niet bewaard.",d:"Zorgen opschrijven maakt ruimte in je hoofd. Je hoeft ze even niet vast te houden."},
beweeg:{i:"ti-walk",l:"Beweeg",b:"text",t:"Loop vijf minuten, rek je uit of schud je armen los. Beweging laat de onrust wegwaaien, net als de wind.",d:"Bewegen helpt je lichaam de spanning van stress kwijt te raken."},

$('home').style.display='flex';put(m.intro)}

function addEntry(title,qa){book.unshift({t:Date.now(),m:cur,l:title,qa});saveBook()}
function savedMsg(){put('<div class="big">Bewaard</div>Je antwoorden staan in je groeiboek, zodat je ze later kunt teruglezen.<div style="display:flex;gap:6px"><button id="vb">Bekijk groeiboek</button></div>');$('vb').onclick=openBook}
function renderGuide(err){const e=P[gs.id],n=e.s.length,i=gs.step;
put('<div class="meta">'+e.l+(n>1?' · vraag '+(i+1)+' van '+n:'')+'</div><div style="color:#F5EDDC;font-size:.95em;line-height:1.25">'+e.s[i]+'</div><textarea id="ga" style="height:7cqw" placeholder="Schrijf je antwoord..."></textarea>'+(err?'<div class="err">'+err+'</div>':'')+'<div style="display:flex;gap:6px">'+(i>0?'<button id="gb">Terug</button>':'')+'<button id="gn">'+(i<n-1?'Volgende':'Bewaar')+'</button></div>');
const ta=$('ga');ta.value=gs.ans[i];ta.oninput=()=>{gs.ans[i]=ta.value;const er=say.querySelector('.err');if(er)er.remove()};
if(i>0)$('gb').onclick=()=>{gs.ans[i]=ta.value;gs.step--;renderGuide()};
$('gn').onclick=()=>{gs.ans[i]=ta.value;if(i<n-1){gs.step++;renderGuide();return}
const qa=e.s.map((q,j)=>({q,a:gs.ans[j].trim()})).filter(x=>x.a);if(!qa.length){renderGuide('Schrijf eerst iets op om te bewaren.');return}addEntry(e.l,qa);gs=null;savedMsg()}}
function askQ(e){let q=e.q[Math.floor(Math.random()*e.q.length)];
const draw=err=>{put('<div class="meta">'+e.l+'</div><div style="color:#F5EDDC;font-size:.95em;line-height:1.25">'+q+'</div><textarea id="qa" style="height:7cqw" placeholder="Schrijf je antwoord..."></textarea>'+(err?'<div class="err">'+err+'</div>':'')+'<div style="display:flex;gap:6px"><button id="qn">Andere vraag</button><button id="qs">Bewaar</button></div>');
const ta=$('qa');ta.oninput=()=>{const er=say.querySelector('.err');if(er)er.remove()};
$('qn').onclick=()=>{let n=q;while(e.q.length>1&&n===q)n=e.q[Math.floor(Math.random()*e.q.length)];q=n;draw()};
$('qs').onclick=()=>{const a=ta.value.trim();if(!a){draw('Schrijf eerst iets op om te bewaren.');return}addEntry(e.l,[{q,a}]);savedMsg()}};draw()}
function exercise(btn){clearInterval(timer);fire.style.transform='scale(1)';gs=null;document.querySelectorAll('.sign').forEach(x=>x.classList.remove('on'));btn.classList.add('on');const id=sel[cur][btn.dataset.n],e=P[id];
if(e.b==='music')musicPanel();
else if(e.b==='breath'){put(e.t+'<div class="big" id="bt"></div><button id="bs">Begin</button>');$('bs').onclick=breathe}
else if(e.b==='write')put(e.t+'<textarea placeholder="Schrijf hier... alleen voor jou"></textarea>');
else if(e.b==='guide'){gs={id,step:0,ans:e.s.map(()=>'')};renderGuide()}
else if(e.b==='q')askQ(e);
else put(e.t)}
function fmt(t){const d=new Date(t);return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}
function openBook(){$('cfg').style.display='flex';renderBook()}
function renderBook(){let h='<div style="display:flex;align-items:center;justify-content:space-between"><span class="hand" style="font-size:1.45em;line-height:1">Je groeiboek</span><button id="cx" aria-label="Sluiten" style="background:transparent;border:none;padding:0 2px"><i class="ti ti-x"></i></button></div>';
if(!book.length)h+='<div style="color:#5A4330;margin:6px 0">Nog leeg. Bij bewolkt, zon en regenboog bewaar je hier je antwoorden.</div>';
else h+='<div style="color:#8C7A60;font-size:.85em;margin:2px 0 4px"><i class="ti ti-device-floppy"></i> '+book.length+' '+(book.length===1?'bladzijde':'bladzijdes')+', bewaard in deze browser</div>'+book.map((e,i)=>'<div class="entry"><div class="eh"><i class="ti '+((M[e.m]||{}).icon||'ti-notebook')+'"></i><span>'+esc(e.l)+'</span><span style="color:#8C7A60;font-size:.85em">· '+fmt(e.t)+'</span><button class="del" data-i="'+i+'">Verwijder</button></div>'+e.qa.map(x=>'<div class="q">'+esc(x.q)+'</div><div class="a">'+esc(x.a)+'</div>').join('')+'</div>').join('');
h+='<div style="display:flex;justify-content:flex-end;margin-top:6px"><button id="ck" style="background:#4A3524;color:#F7F0E1;border:1px solid #4A3524;border-radius:4px;padding:1px 14px">Sluiten</button></div>';
const c=$('card');c.innerHTML=h;c.scrollTop=0;
c.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(!b.classList.contains('c')){b.classList.add('c');b.textContent='Zeker?';return}book.splice(+b.dataset.i,1);saveBook();renderBook()});
$('ck').onclick=closeCfg;$('cx').onclick=closeCfg}
let cm='storm',warn='',info=false;
function openCfg(k){cm=k;warn='';info=false;$('cfg').style.display='flex';renderCfg()}
function renderCfg(){const s=sel[cm],pl=pool(cm),calm=pl===CALM;
let h='<div style="display:flex;align-items:center;gap:6px"><span class="hand" style="font-size:1.45em;line-height:1;flex:1">'+(info?'Over de bordjes':'Stel je wegwijzer samen')+'</span><button id="ci" class="ib'+(info?' on':'')+'" aria-pressed="'+info+'"><i class="ti ti-info-circle"></i>Info</button><button id="cx" aria-label="Sluiten" style="background:transparent;border:none;padding:0 2px"><i class="ti ti-x"></i></button></div>';
h+='<div class="tabs">'+order.map(o=>'<button data-k="'+o+'" class="'+(o===cm?'on':'')+'"><i class="ti '+M[o].icon+'"></i><span>'+M[o].t+'</span></button>').join('')+'</div>';
if(info){
h+='<div style="margin:2px 0 5px;color:#5A4330">'+(calm?'<i class="ti ti-flame" style="color:#6E4A2A"></i> Rustbordjes helpen je in het moment tot rust te komen. Wat je hier opschrijft wordt niet bewaard.':'<i class="ti ti-plant" style="color:#6E4A2A"></i> Groeibordjes helpen je stress beter te begrijpen en voor te zijn, en een beetje te groeien. Bij bordjes met <i class="ti ti-device-floppy"></i> kun je je antwoorden bewaren in je groeiboek.')+'</div>';
h+='<div class="info">'+pl.map(id=>{const e=P[id],sv=e.b==='guide'||e.b==='q';return '<div><div class="ih"><i class="ti '+e.i+'"></i>'+e.l+(sv?'<i class="ti ti-device-floppy sv" aria-label="wordt bewaard"></i>':'')+'</div><p>'+e.d+'</p></div>'}).join('')+'</div>';
h+='<div style="display:flex;justify-content:flex-end;margin-top:6px"><button id="cb" style="background:#4A3524;color:#F7F0E1;border:1px solid #4A3524;border-radius:4px;padding:1px 14px">Terug naar kiezen</button></div>';
}else{
h+='<div style="margin:2px 0 4px;color:#5A4330"><i class="ti '+(calm?'ti-flame':'ti-plant')+'" style="color:#6E4A2A"></i> '+(calm?'Rustbordjes, om tot rust te komen':'Groeibordjes, voor omgaan met stress en persoonlijke groei')+' · <span style="color:#22170F">'+s.length+' van '+MAX+' gekozen</span>'+(warn?' <span style="color:#993C1D">· '+warn+'</span>':'')+'</div>';
h+='<div class="chips">'+pl.map(id=>{const on=s.includes(id);return '<button data-id="'+id+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'"><i class="ti '+P[id].i+'"></i>'+P[id].l+(on?'<i class="ti ti-check ck"></i>':'')+'</button>'}).join('')+'</div>';
h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:5px"><span style="color:#8C7A60;font-size:.85em"><i class="ti ti-device-floppy"></i> wordt bewaard in deze browser</span><span style="display:flex;gap:6px"><button id="cd" style="background:transparent;border:1px solid #8C7A60;border-radius:4px;padding:1px 10px">Standaard</button><button id="ck" style="background:#4A3524;color:#F7F0E1;border:1px solid #4A3524;border-radius:4px;padding:1px 14px">Klaar</button></span></div>';}
const c=$('card');c.innerHTML=h;c.scrollTop=0;
c.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cm=b.dataset.k;warn='';renderCfg()});
$('ci').onclick=()=>{info=!info;renderCfg()};$('cx').onclick=closeCfg;
if(info){$('cb').onclick=()=>{info=false;renderCfg()};return}
c.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{const id=b.dataset.id,a=sel[cm];warn='';
if(a.includes(id)){if(a.length<=1)warn='houd er minstens één';else a.splice(a.indexOf(id),1)}
else{if(a.length>=MAX)warn='vol, haal er eerst één weg';else{a.push(id);a.sort((x,y)=>pl.indexOf(x)-pl.indexOf(y))}}saveSel();renderCfg()});
$('cd').onclick=()=>{sel[cm]=DEF[cm].slice();warn='';saveSel();renderCfg()};
$('ck').onclick=closeCfg}
function closeCfg(){$('cfg').style.display='none'}
function breathe(){clearInterval(timer);const t=$('bt'),bs=$('bs');if(bs)bs.remove();let s=0;const ph=[["Adem in",4,1.6],["Houd vast",4,1.6],["Adem uit",6,1]];
const step=()=>{const p=ph[s%3];fire.style.transitionDuration=p[1]+'s';fire.style.transform='scale('+p[2]+')';let r=p[1];t.textContent=p[0]+' · '+r;
clearInterval(timer);timer=setInterval(()=>{r--;if(r>0)t.textContent=p[0]+' · '+r;else{s++;if(s>=15){clearInterval(timer);t.textContent='Goed gedaan';fire.style.transform='scale(1)'}else step()}},1000)};step()}
const LK=[["ti-piano","Rustige pianomuziek","rustige piano muziek ontspannen"],["ti-cloud-rain","Regen en natuurgeluiden","regen natuur geluiden ontspannen"],["ti-player-play","Geleide ademhaling (video)","geleide ademhaling oefening nederlands"]];
function go(q){window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank')}
function musicPanel(){let h='Luister even mee met het bos.<button id="mt">'+(snd?'Stop kampvuurklanken':'Speel kampvuurklanken')+'</button><div style="font-size:.85em;margin-top:8px;color:#CFC8BA">of kijk en luister elders:</div>';
LK.forEach((l,i)=>{h+='<button class="lnk" data-q="'+i+'"><i class="ti '+l[0]+'"></i>'+l[1]+' <i class="ti ti-external-link" style="font-size:.8em"></i></button>'});
put(h);$('mt').onclick=toggleSound;say.querySelectorAll('.lnk').forEach(b=>b.onclick=()=>go(LK[b.dataset.q][2]))}
let snd=null;
function syncSound(){const b=$('sndb');b.classList.toggle('on',!!snd);b.setAttribute('aria-pressed',snd?'true':'false');b.innerHTML='<i class="ti '+(snd?'ti-volume':'ti-volume-off')+'"></i>Klanken';const m=$('mt');if(m)m.textContent=snd?'Stop kampvuurklanken':'Speel kampvuurklanken'}
function toggleSound(){if(snd)stopSound();else startSound();syncSound()}
$('sndb').onclick=toggleSound;
function startSound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);master.gain.linearRampToValueAtTime(.9,ctx.currentTime+3);
const len=ctx.sampleRate*4,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
const wind=ctx.createBufferSource();wind.buffer=buf;wind.loop=true;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;const wg=ctx.createGain();wg.gain.value=.18;
const lfo=ctx.createOscillator();lfo.frequency.value=.08;const lg=ctx.createGain();lg.gain.value=.1;lfo.connect(lg);lg.connect(wg.gain);wind.connect(lp);lp.connect(wg);wg.connect(master);wind.start();lfo.start();
const pad=ctx.createGain();pad.gain.value=.045;const pf=ctx.createBiquadFilter();pf.type='lowpass';pf.frequency.value=900;pad.connect(pf);pf.connect(master);
[146.83,220,277.18,329.63].forEach((f,i)=>{const o=ctx.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=f;o.detune.value=(i-1.5)*4;const og=ctx.createGain();og.gain.value=.5;const tl=ctx.createOscillator();tl.frequency.value=.05+i*.03;const tg=ctx.createGain();tg.gain.value=.35;tl.connect(tg);tg.connect(og.gain);o.connect(og);og.connect(pad);o.start();tl.start()});
const cb=ctx.createBuffer(1,ctx.sampleRate*.03,ctx.sampleRate),cd=cb.getChannelData(0);for(let i=0;i<cd.length;i++)cd[i]=(Math.random()*2-1)*Math.pow(1-i/cd.length,4);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=.8;bp.connect(master);
let alive=true;(function crackle(){if(!alive)return;const s=ctx.createBufferSource();s.buffer=cb;s.playbackRate.value=.6+Math.random()*1.2;const cg=ctx.createGain();cg.gain.value=.04+Math.random()*.16;s.connect(cg);cg.connect(bp);s.start();setTimeout(crackle,60+Math.random()*(Math.random()<.2?600:220))})();
snd={ctx,master,stop(){alive=false}};notes.style.display=''}
function stopSound(){if(!snd)return;const s=snd;snd=null;s.stop();s.master.gain.cancelScheduledValues(s.ctx.currentTime);s.master.gain.setValueAtTime(s.master.gain.value,s.ctx.currentTime);s.master.gain.linearRampToValueAtTime(0,s.ctx.currentTime+1.5);setTimeout(()=>s.ctx.close(),1700);notes.style.display='none'}
start();
</script>
